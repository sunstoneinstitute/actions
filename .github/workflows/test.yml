name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck combine-prs/lib.sh combine-prs/combine-prs.sh scripts/bump-release.sh record-deployment/record-deployment.sh
  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo npm install -g bats
      - run: bats combine-prs/test scripts/test record-deployment/test
  update-deploy-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships mikefarah yq v4.
      - run: bash update-deploy-branch/test-image-matcher.sh
      - run: bash update-deploy-branch/test-trailer.sh
