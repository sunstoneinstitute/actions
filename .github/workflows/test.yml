name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck combine-prs/lib.sh combine-prs/combine-prs.sh
  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo npm install -g bats
      - run: bats combine-prs/test
