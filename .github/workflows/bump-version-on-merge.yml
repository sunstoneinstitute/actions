name: Bump Version on Merge

# Adapted from sunstoneinstitute/horndb (bump-version-on-merge.yml), reshaped
# for this tag-only actions repo. On PR merge into main, cut a new vX.Y.Z tag
# at the merge commit and slide the floating major tag vN to it. A
# bump-(major|minor|patch) label picks the bump. Without a label, a PR that
# changes action code gets a patch release, and any other PR only slides vN
# so it stays on main HEAD.

on:
  pull_request:
    types: [closed]

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BUMP=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json labels -q '.labels[].name' | grep -E '^bump-(major|minor|patch)$' | head -1 || true)
          if [ -n "$BUMP" ]; then
            TYPE="${BUMP#bump-}"
          else
            source scripts/bump-release.sh
            if gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
                --json files -q '.files[].path' | changes_action_code; then
              TYPE=patch
            else
              TYPE=slide
            fi
          fi
          echo "Bump type: ${TYPE}"
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"

      - name: Tag release and slide major tag
        env:
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: scripts/bump-release.sh "$BUMP_TYPE"
