name: Promote Images
description: >
  Promote container images from one environment to another. Resolves the
  source deploy branch commit, computes a semver prod tag, copies images
  with crane, updates the target deploy branch, and creates a git tag.
  Caller must: checkout with fetch-depth 0, authenticate to both registries,
  and have crane available (or let this action install it).

inputs:
  from-env:
    description: Source environment
    required: false
    default: dev
  to-env:
    description: Target environment
    required: false
    default: prod
  images:
    description: >
      Space-separated list of image names (e.g. "hugin molnir" or
      "app migrations"). Must match the image name suffixes in overlay
      kustomization.yaml files.
    required: true
  from-registry:
    description: Source container registry prefix
    required: true
  to-registry:
    description: Target container registry prefix
    required: true
  version-file:
    description: >
      Path to the file containing the version (.toml or .json).
      If omitted, auto-detects pyproject.toml or package.json in repo root.
    required: false
  source-sha:
    description: >
      Specific commit SHA on the source deploy branch to promote.
      Defaults to the latest commit on last-deploy/<from-env>.
    required: false
  overlay-base:
    description: Base path for Kustomize overlays
    required: false
    default: deploy/overlays
  overlay-path:
    description: >
      Glob pattern for overlay kustomization files, passed through to
      update-deploy-branch. When omitted, auto-detected from overlay-base:
      tries per-image subdirs first, falls back to flat layout.
    required: false

outputs:
  from-tag:
    description: Image tag on the source environment
    value: ${{ steps.resolve.outputs.tag }}
  to-tag:
    description: Semver tag applied to the target environment
    value: ${{ steps.version.outputs.tag }}
  source-sha:
    description: Commit SHA on the source deploy branch that was promoted
    value: ${{ steps.resolve.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Install crane
      uses: imjasonh/setup-crane@v0.5

    - name: Install yq
      uses: mikefarah/yq@v4

    - name: Resolve source deploy commit
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        FROM_ENV="${{ inputs.from-env }}"
        SOURCE_SHA="${{ inputs.source-sha }}"
        IMAGES="${{ inputs.images }}"
        OVERLAY_BASE="${{ inputs.overlay-base }}"
        BRANCH="last-deploy/${FROM_ENV}"

        git fetch origin "$BRANCH"

        # Resolve the main SHA that the source deploy branch is based on
        # by reading the main-sha trailer from the latest deploy commit.
        if [ -z "$SOURCE_SHA" ]; then
          SOURCE_SHA=$(git log --format=%B -20 "origin/${BRANCH}" \
            | grep -m1 '^main-sha:' | awk '{print $2}')
          if [ -z "$SOURCE_SHA" ]; then
            echo "::error::No main-sha trailer found on ${BRANCH}. Deploy branch needs manual repair."
            exit 1
          fi
        fi
        echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

        # Extract the image tag from the source overlay kustomization.
        # Try per-image subdir layout first, fall back to flat layout.
        FIRST_IMAGE=$(echo "$IMAGES" | awk '{print $1}')
        SUBDIR_KUSTOMIZATION="${OVERLAY_BASE}/${FROM_ENV}/${FIRST_IMAGE}/kustomization.yaml"
        FLAT_KUSTOMIZATION="${OVERLAY_BASE}/${FROM_ENV}/kustomization.yaml"

        if git show "origin/${BRANCH}:${SUBDIR_KUSTOMIZATION}" >/dev/null 2>&1; then
          KUSTOMIZATION="$SUBDIR_KUSTOMIZATION"
        else
          KUSTOMIZATION="$FLAT_KUSTOMIZATION"
        fi

        git checkout "origin/${BRANCH}" -- "$KUSTOMIZATION"
        TAG=$(yq ".images[] | select(.name == \"*${FIRST_IMAGE}\") | .newTag" "$KUSTOMIZATION")
        # Fall back to first image entry if name selector didn't match
        if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
          TAG=$(yq '.images[0].newTag' "$KUSTOMIZATION")
        fi
        git checkout HEAD -- .

        if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
          echo "::error::Could not extract image tag from ${KUSTOMIZATION}"
          exit 1
        fi

        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Source: ${BRANCH} @ ${SOURCE_SHA::7}, tag: ${TAG}"

    - name: Compute target version
      id: version
      uses: sunstoneinstitute/actions/compute-version@v1
      with:
        version-file: ${{ inputs.version-file }}

    - name: Copy images to target registry
      shell: bash
      run: |
        set -euo pipefail
        FROM_TAG="${{ steps.resolve.outputs.tag }}"
        TO_TAG="${{ steps.version.outputs.tag }}"
        FROM_REGISTRY="${{ inputs.from-registry }}"
        TO_REGISTRY="${{ inputs.to-registry }}"

        for img in ${{ inputs.images }}; do
          echo "Copying ${img}:${FROM_TAG} → ${img}:${TO_TAG}"
          crane copy \
            "${FROM_REGISTRY}/${img}:${FROM_TAG}" \
            "${TO_REGISTRY}/${img}:${TO_TAG}"
        done

    - name: Detect overlay path for target env
      id: overlay
      shell: bash
      run: |
        set -euo pipefail
        OVERLAY_PATH="${{ inputs.overlay-path }}"
        if [ -z "$OVERLAY_PATH" ]; then
          TO_ENV="${{ inputs.to-env }}"
          OVERLAY_BASE="${{ inputs.overlay-base }}"
          # Mixed layouts are real: a repo can have BOTH a flat
          # deploy/overlays/<env>/kustomization.yaml (the app) AND
          # deploy/overlays/<env>/<job>/kustomization.yaml subdirs
          # (sidecars like migrations). A subdir-only glob silently
          # skips the flat file and the deploy commit ships with the
          # wrong newTag. Collect every overlay that exists.
          PATHS=()
          FLAT="${OVERLAY_BASE}/${TO_ENV}/kustomization.yaml"
          [ -f "$FLAT" ] && PATHS+=("$FLAT")
          if compgen -G "${OVERLAY_BASE}/${TO_ENV}/*/kustomization.yaml" >/dev/null 2>&1; then
            while IFS= read -r f; do
              PATHS+=("$f")
            done < <(compgen -G "${OVERLAY_BASE}/${TO_ENV}/*/kustomization.yaml")
          fi
          if [ ${#PATHS[@]} -eq 0 ]; then
            echo "::error::No kustomization.yaml found under ${OVERLAY_BASE}/${TO_ENV}"
            exit 1
          fi
          OVERLAY_PATH="${PATHS[*]}"
        fi
        echo "Detected overlay paths: ${OVERLAY_PATH}"
        echo "path=${OVERLAY_PATH}" >> "$GITHUB_OUTPUT"

    - name: Update target deploy branch
      uses: sunstoneinstitute/actions/update-deploy-branch@v1
      with:
        env: ${{ inputs.to-env }}
        images: ${{ inputs.images }}
        registry: ${{ inputs.to-registry }}
        tag: ${{ steps.version.outputs.tag }}
        source-ref: ${{ steps.resolve.outputs.sha }}
        overlay-path: ${{ steps.overlay.outputs.path }}

    - name: Create git tag
      shell: bash
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        git tag "$TAG"
        git push origin "$TAG"
        echo "Tagged ${TAG}"
