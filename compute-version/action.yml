name: Compute Version
description: >
  Compute a semver prod tag from pyproject.toml or package.json major.minor,
  auto-incrementing the patch number based on existing git tags.

inputs:
  project-type:
    description: >
      Project type for version extraction: "python" (pyproject.toml),
      "npm" (package.json), or "auto" (detect from files present).
    required: false
    default: auto
  version-file:
    description: >
      Path to version file. Defaults to pyproject.toml (python) or
      package.json (npm) in the repo root.
    required: false

outputs:
  tag:
    description: Full semver tag (e.g. "v1.3.6")
    value: ${{ steps.version.outputs.tag }}
  major-minor:
    description: Major.minor version (e.g. "1.3")
    value: ${{ steps.version.outputs.major_minor }}

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        PROJECT_TYPE="${{ inputs.project-type }}"
        VERSION_FILE="${{ inputs.version-file }}"

        # Auto-detect project type
        if [ "$PROJECT_TYPE" = "auto" ]; then
          if [ -f "pyproject.toml" ]; then
            PROJECT_TYPE="python"
          elif [ -f "package.json" ]; then
            PROJECT_TYPE="npm"
          else
            echo "::error::Cannot auto-detect project type: no pyproject.toml or package.json found"
            exit 1
          fi
        fi

        # Set default version file
        if [ -z "$VERSION_FILE" ]; then
          case "$PROJECT_TYPE" in
            python) VERSION_FILE="pyproject.toml" ;;
            npm)    VERSION_FILE="package.json" ;;
          esac
        fi

        # Extract major.minor
        case "$PROJECT_TYPE" in
          python)
            MAJOR_MINOR=$(python3 -c "
        import tomllib, pathlib
        d = tomllib.loads(pathlib.Path('$VERSION_FILE').read_text())
        v = d.get('project', d.get('tool', {}).get('poetry', {})).get('version', '')
        print('.'.join(v.split('.')[:2]))
        ")
            ;;
          npm)
            MAJOR_MINOR=$(python3 -c "
        import json, pathlib
        v = json.loads(pathlib.Path('$VERSION_FILE').read_text())['version']
        print('.'.join(v.split('.')[:2]))
        ")
            ;;
          *)
            echo "::error::Unknown project type: $PROJECT_TYPE"
            exit 1
            ;;
        esac

        if [ -z "$MAJOR_MINOR" ] || [ "$MAJOR_MINOR" = "." ]; then
          echo "::error::Could not extract version from $VERSION_FILE"
          exit 1
        fi

        # Find latest patch tag and increment
        LATEST_TAG=$(git tag --list "v${MAJOR_MINOR}.*" --sort=-v:refname | head -1)
        if [ -z "$LATEST_TAG" ]; then
          PROD_TAG="v${MAJOR_MINOR}.0"
        else
          PATCH="${LATEST_TAG##"v${MAJOR_MINOR}."}"
          PROD_TAG="v${MAJOR_MINOR}.$((PATCH + 1))"
        fi

        echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
        echo "tag=${PROD_TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed version: ${PROD_TAG} (from ${VERSION_FILE})"
