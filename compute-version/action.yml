name: Compute Version
description: >
  Compute a semver prod tag from pyproject.toml or package.json major.minor,
  auto-incrementing the patch number based on existing git tags.

inputs:
  version-file:
    description: >
      Path to the file containing the version. Supports pyproject.toml
      (TOML) and package.json (JSON). If omitted, auto-detects by looking
      for pyproject.toml then package.json in the repo root.
    required: false

outputs:
  tag:
    description: Full semver tag (e.g. "v1.3.6")
    value: ${{ steps.version.outputs.tag }}
  major-minor:
    description: Major.minor version (e.g. "1.3")
    value: ${{ steps.version.outputs.major_minor }}

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        set -euo pipefail
        VERSION_FILE="${{ inputs.version-file }}"

        # Auto-detect version file if not specified
        if [ -z "$VERSION_FILE" ]; then
          if [ -f "pyproject.toml" ]; then
            VERSION_FILE="pyproject.toml"
          elif [ -f "package.json" ]; then
            VERSION_FILE="package.json"
          else
            echo "::error::No version file specified and no pyproject.toml or package.json found"
            exit 1
          fi
        fi

        # Extract major.minor based on file extension
        case "$VERSION_FILE" in
          *.toml)
            MAJOR_MINOR=$(python3 -c "
        import tomllib, pathlib
        d = tomllib.loads(pathlib.Path('$VERSION_FILE').read_text())
        v = d.get('project', d.get('tool', {}).get('poetry', {})).get('version', '')
        print('.'.join(v.split('.')[:2]))
        ")
            ;;
          *.json)
            MAJOR_MINOR=$(python3 -c "
        import json, pathlib
        v = json.loads(pathlib.Path('$VERSION_FILE').read_text())['version']
        print('.'.join(v.split('.')[:2]))
        ")
            ;;
          *)
            echo "::error::Unsupported file type: $VERSION_FILE (expected .toml or .json)"
            exit 1
            ;;
        esac

        if [ -z "$MAJOR_MINOR" ] || [ "$MAJOR_MINOR" = "." ]; then
          echo "::error::Could not extract version from $VERSION_FILE"
          exit 1
        fi

        # Find latest patch tag and increment
        LATEST_TAG=$(git tag --list "v${MAJOR_MINOR}.*" --sort=-v:refname | head -1)
        if [ -z "$LATEST_TAG" ]; then
          PROD_TAG="v${MAJOR_MINOR}.0"
        else
          PATCH="${LATEST_TAG##"v${MAJOR_MINOR}."}"
          PROD_TAG="v${MAJOR_MINOR}.$((PATCH + 1))"
        fi

        echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
        echo "tag=${PROD_TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed version: ${PROD_TAG} (from ${VERSION_FILE})"
